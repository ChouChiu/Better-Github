name: Build

on:
  push:
  pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
    
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install

            - name: Build
              run: bun run build

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
               path: "dist/*.js"
               archive: false
            
            